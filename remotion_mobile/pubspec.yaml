name: remotion_mobile
description: "A new Flutter project."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.4

dependencies:
  flutter:
    sdk: flutter

  http: ^1.6.0
  speech_to_text: ^7.0.0
  # ^6.5.1
  flutter_tts: ^3.8.5

  # MediaPipe Pose Landmarker
  flutter_mp_pose_landmarker:
    git:
      url: https://github.com/mohammed893/flutter_pose_mediapipe

  webview_flutter: ^4.8.0
  cupertino_icons: ^1.0.8

  # Video Player
  video_player: ^2.9.5

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/logo.png
    - assets/robot.png
    - assets/easy.png
    - assets/Stiff.png
    - assets/Hurts a lot.png
    - assets/videos/hamstring_curls.mp4
    - assets/videos/standing_knee_raise.mp4
    - assets/videos/side_leg_raise.mp4
    - assets/videos/step_touch.mp4
    - assets/videos/calf_raises.mp4




    